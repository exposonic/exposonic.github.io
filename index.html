<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expo Sonic - Convenciones en Argentina</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-29W3Y5CDRT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-29W3Y5CDRT');
  </script>

  <!-- Favicons -->
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="shortcut icon" type="image/png" href="favicon3.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Fuentes: Righteous para títulos, Montserrat para el botón del header -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Righteous&display=swap" rel="stylesheet" />

  <!-- Schema.org -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Expo Sonic",
    "alternateName": ["Sonic Fest Argentina", "Expo Sonic", "Sonic Argentina"],
    "description": "Eventos y convenciones familiares de Sonic en Argentina.",
    "sameAs": [
      "https://www.instagram.com/sonicfestok/",
      "https://www.youtube.com/@SonicFestArg"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer support",
      "areaServed": "AR",
      "availableLanguage": "Spanish"
    },
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Buenos Aires",
      "addressCountry": "AR"
    }
  }
  </script>

  <style>
    :root {
      --accent: #ffcc00;
      --bg-glass: rgba(15, 20, 30, 0.7);
      --border-glass: rgba(255, 255, 255, 0.1);
      --text: #f0f4f8;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
      opacity: 0;
      transition: opacity 0.5s ease;
      background-color: #020408;
    }

    body.loaded {
      opacity: 1;
    }

    /* Fondo extra oscuro */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(rgba(2, 4, 8, 0.88), rgba(2, 4, 8, 0.95)), url('Images/IMG-20260129-WA0114.jpg') center/cover;
      z-index: -1;
    }

    /* Header Navbar Profesional */
    .modern-nav {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(2, 4, 8, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
      box-sizing: border-box;
      z-index: 1000;
    }

    .nav-brand {
      font-family: 'Righteous', sans-serif;
      font-size: 1.5rem;
      color: #fff;
      letter-spacing: 1px;
    }

    /* Tipografía distinta para el botón de próximos eventos */
    .nav-highlight {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #0056b3, #003d82);
      color: #fff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 86, 179, 0.4);
      letter-spacing: 0.5px;
    }

    .nav-highlight:hover {
      background: linear-gradient(135deg, #0073e6, #0056b3);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 86, 179, 0.6);
    }

    /* Contenedor Principal */
    .main-wrapper {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 20px 40px 20px;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      margin-bottom: 50px;
    }

    .hero-logo {
      max-width: 350px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      margin-bottom: 30px;
    }

    .hero h1 {
      font-family: 'Righteous', sans-serif;
      font-size: 3rem;
      color: var(--accent);
      margin: 0 0 15px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .hero p {
      font-size: 1.2rem;
      color: #cbd5e1;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Grid de Acciones */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    .action-card {
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 25px 20px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .action-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
      transform: translateY(-5px);
    }

    .action-card.primary {
      background: rgba(255, 204, 0, 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <nav class="modern-nav">
    <div class="nav-brand">EXPO SONIC</div>
    <a href="https://exposonic.github.io/eventos.html" class="nav-highlight">⚡ PRÓXIMOS EVENTOS</a>
  </nav>

  <div class="main-wrapper">
    
    <!-- Hero Section -->
    <header class="hero">
      <img src="Images/Expo Sonic Logo.jpg" class="hero-logo" alt="Expo Sonic Logo">
      <h1>Expo Sonic</h1>
      <p>La convención definitiva para fans de Sonic en Argentina 🇦🇷</p>
    </header>

    <!-- Botonera -->
    <section class="action-grid">
      <a href="https://www.instagram.com/p/DZ7pXacDs8S/?igsh=dzlpa2g1OGhwdHUz" target="_blank" rel="noopener noreferrer" class="action-card primary">
        <span>Próxima Expo 27/09</span>
        <span style="font-size: 0.85rem; font-weight: normal; margin-top: 5px; color: #fff;">100% Gratuita - ¡Agendá la fecha!</span>
      </a>
      
      <a href="https://sonicfest.com.ar/convocatoriastands" target="_blank" rel="noopener noreferrer" class="action-card">
        <span>Convocatoria de Stands</span>
      </a>

      <a href="https://maps.app.goo.gl/rjuS7tSSPfJ5QVW1A" target="_blank" rel="noopener noreferrer" class="action-card">
        <span>📍 Cómo llegar</span>
        <span style="font-size: 0.85rem; font-weight: normal; margin-top: 5px;">Club Cultural Matienzo (Google Maps)</span>
      </a>

      <a href="https://sonicfest.com.ar/infoexpo1" target="_blank" rel="noopener noreferrer" class="action-card">
        <span>📸 Ver fotos de la última Expo</span>
      </a>

      <a href="https://www.instagram.com/exposonic/" target="_blank" class="action-card">
        <span>📱 Instagram Oficial</span>
      </a>
    </section>

    <!-- Placeholders Originales -->
    <div id="botones-placeholder"></div>
    <div id="donaciones-placeholder"></div>
    <div id="footer-placeholder"></div>

  </div>

  <script>
    window.addEventListener('load', () => {
      document.body.classList.add('loaded');
    });
  </script>
</body>
</html>
